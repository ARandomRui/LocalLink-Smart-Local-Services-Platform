{% extends "base.html" %}
{% block content %}
<h3>Create Service</h3>
<form method="POST" class="card p-4 shadow">
    <div class="mb-3">
        <label>Service Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Description</label>
        <textarea name="description" class="form-control" rows="3" required></textarea>
    </div>
    <div class="mb-3">
        <label>Price (₹)</label>
        <input type="number" name="price" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Location</label>
        <input type="text" name="location" id="service-location" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Create Service</button>
</form>

<!-- Load Google Maps Places API to provide address autocomplete suggestions, ensuring accurate location data and reducing user typing errors -->
<script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&libraries=places" async defer></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Initialize Google Autocomplete for the location input
        const locationInput = document.getElementById('service-location');
        if (locationInput) {
            // We use setTimeout to ensure the Google Maps script has loaded
            const initAutocomplete = () => {
                if (window.google && window.google.maps && window.google.maps.places) {
                    new google.maps.places.Autocomplete(locationInput);
                } else {
                    setTimeout(initAutocomplete, 100);
                }
            };
            initAutocomplete();
        }
    });
</script>
{% endblock %}
