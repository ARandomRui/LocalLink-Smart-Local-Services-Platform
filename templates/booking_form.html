{% extends "base.html" %}
{% block content %}
<h3>Book Service: {{ service.name }}</h3>
<form method="POST" class="card p-4 shadow">
    <div class="mb-3">
        <label class="form-label">Your Name</label>
        <input type="text" name="customer_name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Age</label>
        <input type="number" name="age" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Gender</label>
        <select name="gender" class="form-control" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text" name="address" id="booking-address" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Booking Date</label>
        <input type="date" name="date" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Time</label>
        <input type="time" name="time" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Payment Method</label>
        <select name="payment_method" class="form-control" required>
            <option value="COD">Cash on Delivery</option>
            <option value="Online">Online</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Submit Booking</button>
</form>

<!-- Load Google Maps Places API to provide address autocomplete suggestions, ensuring accurate location data and reducing user typing errors -->
<script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&libraries=places" async defer></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const addressInput = document.getElementById('booking-address');
        if (addressInput) {
            const initAutocomplete = () => {
                if (window.google && window.google.maps && window.google.maps.places) {
                    new google.maps.places.Autocomplete(addressInput);
                } else {
                    setTimeout(initAutocomplete, 100);
                }
            };
            initAutocomplete();
        }
    });
</script>
{% endblock %}
